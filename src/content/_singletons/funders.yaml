text:
  de: "Das Projekt wird gefördert durch die Deutsche Forschungsgemeinschaft (DFG) im Rahmen der Exzellenzstrategie des Bundes und der Länder – EXC 2037 „CLICCS - Klima, Klimawandel und Gesellschaft“ – Projektnummer: 390683824, dem Leibniz-Institut zur Analyse des Biodiversitätswandels (LIB), der Claussen-Simon-Stiftung, der Alfred Toepfer Stiftung F.V.S. und der NUE aus Erträgen von BINGO!-Die Umweltlotterie."
  en: "Das Projekt wird gefördert durch die Deutsche Forschungsgemeinschaft (DFG) im Rahmen der Exzellenzstrategie des Bundes und der Länder – EXC 2037 „CLICCS - Klima, Klimawandel und Gesellschaft“ – Projektnummer: 390683824, dem Leibniz-Institut zur Analyse des Biodiversitätswandels (LIB), der Claussen-Simon-Stiftung, der Alfred Toepfer Stiftung F.V.S. und der NUE aus Erträgen von BINGO!-Die Umweltlotterie."
